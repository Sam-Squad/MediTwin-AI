services:
  # ─────────────────────────────────────────
  # MediTwin AI — Backend (FastAPI)
  # ─────────────────────────────────────────
  - type: web
    name: meditwin-ai-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URL
        sync: false          # Set this in Render dashboard → paste your Atlas URI
      - key: DATABASE_NAME
        value: meditwin_db
      - key: GEMINI_API_KEY
        sync: false          # Set this in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates a secure random key
      - key: ADMIN_EMAIL
        value: admin@meditwin.ai
      - key: ADMIN_PASSWORD
        sync: false          # Set this in Render dashboard
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
